<div class="titulo-vista">Citas</div>

<div class="modo-toggle" role="tablist" aria-label="Vista de citas">
  <button class="modo-btn activo" id="btn-modo-calendario" role="tab" onclick="cambiarModo('calendario')">📆 Calendario</button>
  <button class="modo-btn"        id="btn-modo-lista"      role="tab" onclick="cambiarModo('lista')">☰ Lista</button>
</div>

<!-- ══ Vista calendario ══ -->
<div id="modo-calendario">
  <div class="cal-card">
    <div class="cal-header">
      <span class="cal-titulo" id="cal-titulo">—</span>
      <div class="cal-nav">
        <button class="cal-nav-btn cal-hoy" onclick="irAHoy()">Hoy</button>
        <button class="cal-nav-btn" onclick="cambiarMes(-1)" aria-label="Mes anterior">‹</button>
        <button class="cal-nav-btn" onclick="cambiarMes(1)"  aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="cal-semana">
      <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-resumen" id="cal-resumen"></div>
  </div>

  <div class="dia-card">
    <div class="dia-titulo" id="dia-titulo">—</div>
    <div class="dia-sub"    id="dia-sub"></div>
    <div id="dia-lista"></div>
  </div>
</div>

<!-- ══ Vista lista ══ -->
<div id="modo-lista" class="oculto">
<div class="filtro-citas">
  <button class="filtro-chip activo" data-estado="" onclick="filtrarPorChip(this, '')">Todas</button>
  <button class="filtro-chip" data-estado="Pendiente"  onclick="filtrarPorChip(this, 'Pendiente')">Pendientes</button>
  <button class="filtro-chip" data-estado="Confirmada" onclick="filtrarPorChip(this, 'Confirmada')">Confirmadas</button>
  <button class="filtro-chip" data-estado="Completada" onclick="filtrarPorChip(this, 'Completada')">Completadas</button>
  <button class="filtro-chip" data-estado="Cancelada"  onclick="filtrarPorChip(this, 'Cancelada')">Canceladas</button>
</div>

<div class="citas-fechas">
  <label class="fecha-campo">
    <span>Desde</span>
    <input type="date" id="filtro-desde" onchange="aplicarFiltroFechas()">
  </label>
  <label class="fecha-campo">
    <span>Hasta</span>
    <input type="date" id="filtro-hasta" onchange="aplicarFiltroFechas()">
  </label>
  <button class="btn-mini" id="btn-hoy"     onclick="filtrarHoy()">Hoy</button>
  <button class="btn-mini" id="btn-limpiar" onclick="limpiarFechas()">Limpiar</button>
  <button class="btn-mini btn-mini-refresh" id="btn-refresh" onclick="recargarCitas()" title="Actualizar citas">↻</button>
</div>

<div class="citas-meta" id="citas-meta"></div>

<div id="citas-skeleton" class="skeleton-wrapper" aria-hidden="true">
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
</div>

<div id="lista-citas" aria-live="polite"></div>

<div class="paginacion oculto" id="paginacion-citas"></div>
</div>

<!-- ══ MODAL: Cancelar cita ══ -->
<div class="modal-overlay oculto" id="modal-cancelar">
  <div class="modal-card">
    <div class="modal-icono">🗑️</div>
    <h3 class="modal-titulo">¿Cancelar esta cita?</h3>
    <p class="modal-sub" id="modal-cancelar-cliente">—</p>
    <div class="modal-acciones">
      <button class="modal-btn modal-btn-secundario" onclick="cerrarModalCancelar()">No, mantener</button>
      <button class="modal-btn modal-btn-peligro"    onclick="confirmarCancelacion()">Sí, cancelar</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: WhatsApp ══ -->
<div class="modal-overlay oculto" id="modal-whatsapp">
  <div class="modal-card">
    <div class="modal-icono">💬</div>
    <h3 class="modal-titulo" id="wa-titulo">Cita cancelada</h3>
    <p class="modal-sub" id="wa-sub">¿Deseas avisarle al cliente por WhatsApp?</p>
    <div class="modal-cliente-info" id="modal-whatsapp-info">
      <span class="modal-cliente-nombre" id="wa-nombre">—</span>
      <span class="modal-cliente-tel"    id="wa-telefono">—</span>
    </div>
    <div class="modal-acciones">
      <button class="modal-btn modal-btn-secundario" onclick="cerrarModalWhatsapp()">No, gracias</button>
      <button class="modal-btn modal-btn-whatsapp"   onclick="abrirWhatsapp()">💬 Sí, contactar</button>
    </div>
  </div>
</div>

<script>
(function () {
  var _citas           = [];
  var _filtroActual    = '';
  var _cargando        = false;
  var _paginaActual    = 1;
  var _totalPaginas    = 1;
  var _total           = 0;
  var _idCitaPendiente = null;
  var POR_PAGINA       = 10;

  var _modo            = 'calendario';
  var _mes             = { y: new Date().getFullYear(), m: new Date().getMonth() };
  var _citasMes        = [];
  var _diaSel          = null;
  var _detalleAbierto  = null;
  var _tokenMes        = 0;
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  window.cargarCitasAdmin     = cargarVistaActual;
  window.filtrarPorChip       = filtrarPorChip;
  window.recargarCitas        = recargarCitas;
  window.cambiarEstado        = cambiarEstado;
  window.cancelarCitaAdmin    = cancelarCitaAdmin;
  window.cerrarModalCancelar  = cerrarModalCancelar;
  window.confirmarCancelacion = confirmarCancelacion;
  window.cerrarModalWhatsapp  = cerrarModalWhatsapp;
  window.abrirWhatsapp        = abrirWhatsapp;
  window.aplicarFiltroFechas  = function() { irAPagina(1); };
  window.filtrarHoy           = filtrarHoy;
  window.limpiarFechas        = limpiarFechas;
  window.irAPagina            = irAPagina;
  window.contactarCliente     = contactarCliente;
  window.cambiarModo          = cambiarModo;
  window.cambiarMes           = cambiarMes;
  window.irAHoy               = irAHoy;
  window.seleccionarDia       = seleccionarDia;
  window.toggleDetalleCita    = toggleDetalleCita;

  if (document.readyState !== 'loading') cargarVistaActual();
  else document.addEventListener('DOMContentLoaded', cargarVistaActual);

  function valorFecha(id) {
    var el = document.getElementById(id);
    return el && el.value ? el.value : null;
  }

  function irAPagina(pagina) {
    if (_cargando) return;
    var desde = valorFecha('filtro-desde');
    var hasta = valorFecha('filtro-hasta');
    if (desde && hasta && desde > hasta) {
      document.getElementById('citas-meta').textContent = 'La fecha "Desde" no puede ser posterior a "Hasta".';
      return;
    }

    _cargando = true;
    setControlesEnabled(false);
    mostrarSkeleton(true);
    limpiarLista();
    ocultarPaginacion();

    google.script.run
      .withSuccessHandler(function(resp) {
        _cargando     = false;
        _citas        = resp.citas || [];
        _total        = resp.total;
        _paginaActual = resp.pagina;
        _totalPaginas = resp.totalPaginas || 1;
        mostrarSkeleton(false);
        setControlesEnabled(true);
        renderizarCitas();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .withFailureHandler(onError)
      .obtenerCitas(_filtroActual || null, pagina, POR_PAGINA, desde, hasta);
  }

  function recargarCitas() {
    if (_modo === 'calendario') cargarMes();
    else irAPagina(_paginaActual);
  }

  function onError(error) {
    _cargando = false;
    mostrarSkeleton(false);
    setControlesEnabled(true);
    document.getElementById('lista-citas').innerHTML =
      '<p style="color:#d9534f;text-align:center;">Error: ' + escHTML(error && error.message ? error.message : error) + '</p>';
  }

  function filtrarPorChip(btn, estado) {
    document.querySelectorAll('.filtro-chip').forEach(function(b) { b.classList.remove('activo'); });
    btn.classList.add('activo');
    _filtroActual = estado;
    irAPagina(1);
  }

  function fechaHoyISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function filtrarHoy() {
    var hoy = fechaHoyISO();
    document.getElementById('filtro-desde').value = hoy;
    document.getElementById('filtro-hasta').value = hoy;
    irAPagina(1);
  }

  function limpiarFechas() {
    document.getElementById('filtro-desde').value = '';
    document.getElementById('filtro-hasta').value = '';
    irAPagina(1);
  }

  /* ══ Calendario ══ */
  function iso(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function cargarVistaActual() {
    if (_modo === 'calendario') cargarMes();
    else irAPagina(1);
  }

  function cambiarModo(modo) {
    if (modo === _modo) return;
    _modo = modo;
    document.getElementById('btn-modo-calendario').classList.toggle('activo', modo === 'calendario');
    document.getElementById('btn-modo-lista').classList.toggle('activo', modo === 'lista');
    document.getElementById('modo-calendario').classList.toggle('oculto', modo !== 'calendario');
    document.getElementById('modo-lista').classList.toggle('oculto', modo !== 'lista');
    cargarVistaActual();
  }

  function cambiarMes(delta) {
    var d = new Date(_mes.y, _mes.m + delta, 1);
    _mes = { y: d.getFullYear(), m: d.getMonth() };
    _diaSel = null;
    _detalleAbierto = null;
    cargarMes();
  }

  function irAHoy() {
    var hoy = new Date();
    _mes = { y: hoy.getFullYear(), m: hoy.getMonth() };
    _diaSel = fechaHoyISO();
    _detalleAbierto = null;
    cargarMes();
  }

  function seleccionarDia(fecha) {
    _diaSel = fecha;
    _detalleAbierto = null;
    renderizarCalendario();
  }

  function cargarMes() {
    var token = ++_tokenMes;
    var desde = iso(_mes.y, _mes.m, 1);
    var hasta = iso(_mes.y, _mes.m, new Date(_mes.y, _mes.m + 1, 0).getDate());
    _citasMes = [];
    setCalCargando(true);
    renderizarCalendario();

    function pedir(pagina) {
      google.script.run
        .withSuccessHandler(function(resp) {
          if (token !== _tokenMes) return;
          _citasMes = _citasMes.concat(resp.citas || []);
          if (resp.hayMas) { pedir(pagina + 1); return; }
          setCalCargando(false);
          renderizarCalendario();
        })
        .withFailureHandler(function(error) {
          if (token !== _tokenMes) return;
          setCalCargando(false);
          document.getElementById('dia-lista').innerHTML =
            '<p style="color:#d9534f;text-align:center;">Error: ' + escHTML(error && error.message ? error.message : error) + '</p>';
        })
        .obtenerCitas(null, pagina, 100, desde, hasta);
    }
    pedir(1);
  }

  function setCalCargando(cargando) {
    ['cal-grid', 'dia-lista'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('cal-cargando', cargando);
    });
  }

  // Clave visual de la cita: pendiente, confirmada, completada, cancelada o vencida
  function claseEstado(c) {
    if (esVencida(c)) return 'vencida';
    return String(c.Estado || '').toLowerCase();
  }

  function textoEstado(c) {
    var k = claseEstado(c);
    return { vencida: 'Cita pasada', pendiente: 'Por confirmar', confirmada: 'Confirmada',
             completada: 'Atendida', cancelada: 'Cancelada' }[k] || (c.Estado || '');
  }

  function citasDelDia(fecha) {
    return _citasMes
      .filter(function(c) { return c.Fecha === fecha; })
      .sort(function(a, b) { return String(a.Hora) < String(b.Hora) ? -1 : 1; });
  }

  function renderizarCalendario() {
    var y = _mes.y, m = _mes.m;
    var hoy = fechaHoyISO();

    if (!_diaSel || _diaSel.slice(0, 7) !== iso(y, m, 1).slice(0, 7)) {
      _diaSel = (hoy.slice(0, 7) === iso(y, m, 1).slice(0, 7)) ? hoy : iso(y, m, 1);
    }

    document.getElementById('cal-titulo').textContent = MESES[m] + ' ' + y;

    // Agrupar por día para marcar puntos
    var porDia = {};
    _citasMes.forEach(function(c) { (porDia[c.Fecha] = porDia[c.Fecha] || []).push(c); });

    var primero = new Date(y, m, 1).getDay();
    var total   = new Date(y, m + 1, 0).getDate();
    var html = '';
    for (var v = 0; v < primero; v++) html += '<span></span>';

    for (var d = 1; d <= total; d++) {
      var f = iso(y, m, d);
      var clases = 'cal-dia' + (f === _diaSel ? ' sel' : '') + (f === hoy ? ' hoy' : '') + (f < hoy ? ' pasado' : '');
      var puntos = '';
      var lista  = porDia[f] || [];
      var vistos = {};
      lista.forEach(function(c) {
        var k = claseEstado(c);
        if (k !== 'cancelada' && !vistos[k] && Object.keys(vistos).length < 3) {
          vistos[k] = true;
          puntos += '<i class="cal-punto punto-' + k + '"></i>';
        }
      });
      html += '<button class="' + clases + '" onclick="seleccionarDia(\'' + f + '\')">' + d
        + (puntos ? '<span class="cal-puntos">' + puntos + '</span>' : '') + '</button>';
    }
    document.getElementById('cal-grid').innerHTML = html;

    // Resumen y lista del día seleccionado
    var delDia   = citasDelDia(_diaSel);
    var activas  = delDia.filter(function(c) { return c.Estado !== 'Cancelada'; }).length;
    document.getElementById('cal-resumen').innerHTML =
      '<span class="cal-badge">' + activas + '</span><span>Cita' + (activas !== 1 ? 's' : '') + ' del día</span>';

    var partes = _diaSel.split('-').map(Number);
    var fechaSel = new Date(partes[0], partes[1] - 1, partes[2]);
    document.getElementById('dia-titulo').textContent =
      DIAS[fechaSel.getDay()] + ', ' + partes[2] + ' de ' + MESES[partes[1] - 1].toLowerCase() + ' de ' + partes[0];
    document.getElementById('dia-sub').textContent =
      delDia.length + ' cita' + (delDia.length !== 1 ? 's' : '') + ' programada' + (delDia.length !== 1 ? 's' : '');

    var cont = document.getElementById('dia-lista');
    cont.innerHTML = '';
    if (delDia.length === 0) {
      cont.innerHTML = '<div class="dia-vacio">No hay citas este día</div>';
      return;
    }

    var frag = document.createDocumentFragment();
    delDia.forEach(function(c) { frag.appendChild(crearFilaCita(c)); });
    cont.appendChild(frag);
  }

  function crearFilaCita(c) {
    var k    = claseEstado(c);
    var item = document.createElement('div');
    item.className = 'dia-item';
    var sub = textoEstado(c) + (c.Nombre_Servicio ? ' · ' + c.Nombre_Servicio : '');

    item.innerHTML =
      '<button class="cita-fila fila-' + k + '" onclick="toggleDetalleCita(\'' + escHTML(c.ID_Cita) + '\')">'
      +   '<span class="fila-izq"><span class="fila-ico">🕒</span>'
      +     '<span class="fila-texto"><span class="fila-hora">' + escHTML(c.Hora) + '</span>'
      +     '<span class="fila-sub">' + escHTML(sub) + '</span></span></span>'
      +   '<span class="fila-cliente">👤 ' + escHTML(c.Nombre_Cliente || 'Cliente') + '</span>'
      + '</button>'
      + '<div class="fila-detalle' + (String(_detalleAbierto) === String(c.ID_Cita) ? '' : ' oculto') + '"></div>';

    if (String(_detalleAbierto) === String(c.ID_Cita)) {
      item.querySelector('.fila-detalle').appendChild(crearCardCita(c));
    }
    return item;
  }

  function toggleDetalleCita(idCita) {
    _detalleAbierto = String(_detalleAbierto) === String(idCita) ? null : idCita;
    renderizarCalendario();
  }

  /* ══ Render ══ */
  function renderizarCitas() {
    var lista = document.getElementById('lista-citas');
    var meta  = document.getElementById('citas-meta');
    lista.innerHTML = '';

    if (_citas.length === 0) {
      meta.textContent = '';
      lista.innerHTML  = '<p style="text-align:center;color:#999;padding:32px 0;">Sin citas para este filtro</p>';
      return;
    }

    var inicio = (_paginaActual - 1) * POR_PAGINA + 1;
    var fin    = inicio + _citas.length - 1;
    meta.textContent = 'Mostrando ' + inicio + '–' + fin + ' de ' + _total + ' cita' + (_total !== 1 ? 's' : '');

    var frag = document.createDocumentFragment();
    _citas.forEach(function(c) { frag.appendChild(crearCardCita(c)); });
    lista.appendChild(frag);

    renderizarPaginacion();
  }

  function renderizarPaginacion() {
    var cont = document.getElementById('paginacion-citas');
    if (_totalPaginas <= 1) { cont.classList.add('oculto'); return; }
    cont.innerHTML =
      '<button onclick="irAPagina(' + (_paginaActual - 1) + ')"' + (_paginaActual <= 1 ? ' disabled' : '') + '>← Anterior</button>'
      + '<span class="pag-info">Página ' + _paginaActual + ' de ' + _totalPaginas + '</span>'
      + '<button onclick="irAPagina(' + (_paginaActual + 1) + ')"' + (_paginaActual >= _totalPaginas ? ' disabled' : '') + '>Siguiente →</button>';
    cont.classList.remove('oculto');
  }

  function ocultarPaginacion() {
    var cont = document.getElementById('paginacion-citas');
    if (cont) cont.classList.add('oculto');
  }

  function crearCardCita(c) {
    var estado    = c.Estado || '';
    var productos = c.Productos || [];
    var botones   = botonesEstado(c);
    var vencida   = esVencida(c);

    var card = document.createElement('div');
    card.className = 'card-cita estado-borde-' + estado.toLowerCase() + (vencida ? ' cita-vencida' : '');
    card.innerHTML =
      '<div class="cita-header">'
      +   '<div class="cita-cliente-box">'
      +     '<span class="cita-cliente">' + escHTML(c.Nombre_Cliente || 'Cliente') + '</span>'
      +     (c.Telefono ? '<span class="cita-telefono">📞 ' + escHTML(c.Telefono) + '</span>' : '')
      +   '</div>'
      +   '<span class="cita-estado estado-' + escHTML(estado.toLowerCase()) + '">' + escHTML(estado) + '</span>'
      + '</div>'
      + '<div class="cita-cuando">'
      +   '<span class="cita-chip">📅 ' + escHTML(formatearFechaDisplay(c.Fecha)) + '</span>'
      +   '<span class="cita-chip">🕒 ' + escHTML(c.Hora) + '</span>'
      +   (vencida ? '<span class="cita-chip cita-chip-vencida">⚠️ Fecha pasada sin atender</span>' : '')
      + '</div>'
      + '<div class="cita-grid">'
      +   dato('Servicio', c.Nombre_Servicio)
      +   dato('Empleado', c.Nombre_Empleado)
      +   dato('Pago', c.Forma_pago)
      +   '<div class="cita-dato"><span class="etiqueta">Total</span><span class="valor total">$' + Number(c.Total || 0).toFixed(2) + '</span></div>'
      + '</div>'
      + (productos.length > 0
          ? '<div class="cita-productos"><span class="etiqueta">Productos</span>'
            + productos.map(function(p) {
                return '<div class="cita-prod-fila"><span>' + escHTML(p.Titulo || 'Producto') + ' ×' + (p.Cantidad || 0)
                  + '</span><span>$' + Number(p.Subtotal || 0).toFixed(2) + '</span></div>';
              }).join('')
            + '</div>'
          : '')
      + (botones ? '<div class="cita-acciones">' + botones + '</div>' : '');
    return card;
  }

  function dato(etiqueta, valor) {
    return '<div class="cita-dato"><span class="etiqueta">' + etiqueta + '</span>'
      + '<span class="valor">' + escHTML(valor || '—') + '</span></div>';
  }

  // Cita de un día anterior que nadie completó ni canceló
  function esVencida(c) {
    var estado = c.Estado || '';
    return (estado === 'Pendiente' || estado === 'Confirmada')
      && String(c.Fecha || '') !== '' && String(c.Fecha) < fechaHoyISO();
  }

  function botonesEstado(c) {
    var estado = c.Estado || '';
    var idCita = c.ID_Cita || '';

    if (estado === 'Cancelada' || estado === 'Completada') return '';
    var btns = '';
    if (esVencida(c)) {
      if (c.Telefono) {
        btns += '<button class="btn-accion-contactar" onclick="contactarCliente(\'' + idCita + '\')">💬 Contactar</button>';
      }
    } else if (estado === 'Pendiente') {
      btns += '<button class="btn-accion-confirmar" onclick="cambiarEstado(\'' + idCita + '\', \'Confirmada\')">Confirmar</button>';
    } else if (estado === 'Confirmada') {
      btns += '<button class="btn-accion-completar" onclick="cambiarEstado(\'' + idCita + '\', \'Completada\')">Completar</button>';
    }
    btns += '<button class="btn-eliminar" onclick="cancelarCitaAdmin(\'' + idCita + '\')">Cancelar</button>';
    return btns;
  }

  function buscarCita(idCita) {
    var fuentes = _modo === 'calendario' ? [_citasMes, _citas] : [_citas, _citasMes];
    for (var f = 0; f < fuentes.length; f++) {
      for (var i = 0; i < fuentes[f].length; i++) {
        if (String(fuentes[f][i].ID_Cita) === String(idCita)) return fuentes[f][i];
      }
    }
    return null;
  }

  // Actualiza el estado en ambas listas y vuelve a dibujar la vista activa
  function aplicarEstadoLocal(idCita, estado) {
    [_citas, _citasMes].forEach(function(arr) {
      arr.forEach(function(c) { if (String(c.ID_Cita) === String(idCita)) c.Estado = estado; });
    });
    if (_modo === 'calendario') renderizarCalendario();
    else renderizarCitas();
  }

  /* ══ Acciones ══ */
  function cambiarEstado(idCita, nuevoEstado) {
    var cita = buscarCita(idCita);
    if (cita) aplicarEstadoLocal(idCita, nuevoEstado);
    google.script.run
      .withSuccessHandler(function() {})
      .withFailureHandler(function(e) { alert((e && e.message) || 'No se pudo cambiar el estado'); recargarCitas(); })
      .cambiarEstadoCita(idCita, nuevoEstado);
  }

  function cancelarCitaAdmin(idCita) {
    var cita = buscarCita(idCita);
    if (!cita) return;
    _idCitaPendiente = idCita;
    document.getElementById('modal-cancelar-cliente').textContent =
      (cita.Nombre_Cliente || '') + ' — ' + formatearFechaDisplay(cita.Fecha) + ' ' + (cita.Hora || '');
    document.getElementById('modal-cancelar').classList.remove('oculto');
  }

  function confirmarCancelacion() {
    var idCita = _idCitaPendiente;
    var cita   = buscarCita(idCita);
    if (!cita) { cerrarModalCancelar(); return; }

    document.getElementById('modal-cancelar').classList.add('oculto');
    aplicarEstadoLocal(idCita, 'Cancelada');

    google.script.run
      .withSuccessHandler(function() {})
      .withFailureHandler(function(e) { alert((e && e.message) || 'No se pudo cancelar la cita'); recargarCitas(); })
      .cancelarCita(idCita);

    abrirModalWhatsapp(cita, 'cancelada');
    _idCitaPendiente = null;
  }

  function contactarCliente(idCita) {
    var cita = buscarCita(idCita);
    if (cita) abrirModalWhatsapp(cita, 'contacto');
  }

  function abrirModalWhatsapp(cita, modo) {
    var telefono = cita.Telefono || '';
    document.getElementById('wa-titulo').textContent = modo === 'contacto' ? 'Contactar al cliente' : 'Cita cancelada';
    document.getElementById('wa-sub').textContent    = modo === 'contacto'
      ? '¿Abrir WhatsApp para escribirle sobre esta cita?'
      : '¿Deseas avisarle al cliente por WhatsApp?';
    document.getElementById('wa-nombre').textContent   = cita.Nombre_Cliente || '';
    document.getElementById('wa-telefono').textContent = '📞 ' + (telefono || 'Sin teléfono');
    var modal = document.getElementById('modal-whatsapp');
    modal.dataset.modo     = modo;
    modal.dataset.telefono = telefono;
    modal.dataset.nombre   = cita.Nombre_Cliente || '';
    modal.dataset.fecha    = formatearFechaDisplay(cita.Fecha);
    modal.dataset.hora     = cita.Hora || '';
    modal.classList.remove('oculto');
  }

  function cerrarModalCancelar() {
    _idCitaPendiente = null;
    document.getElementById('modal-cancelar').classList.add('oculto');
  }

  function cerrarModalWhatsapp() {
    document.getElementById('modal-whatsapp').classList.add('oculto');
  }

  function abrirWhatsapp() {
    var modal    = document.getElementById('modal-whatsapp');
    var telefono = modal.dataset.telefono;

    if (!telefono) {
      alert('Este cliente no tiene teléfono registrado.');
      cerrarModalWhatsapp();
      return;
    }

    var numero = telefono.toString().replace(/\D/g, '');
    if (numero.length === 8) numero = '503' + numero;

    var mensaje = modal.dataset.modo === 'contacto'
      ? 'Hola ' + modal.dataset.nombre + ', te escribimos por tu cita del ' + modal.dataset.fecha + ' a las '
        + modal.dataset.hora + '. ¿Pudiste asistir? Si deseas reagendar, contáctanos. ¡Gracias!'
      : 'Hola ' + modal.dataset.nombre + ', te escribimos para avisarte que tu cita del '
        + modal.dataset.fecha + ' a las ' + modal.dataset.hora + ' ha sido cancelada. Si deseas reagendar, contáctanos. ¡Gracias!';

    window.open('https://wa.me/' + numero + '?text=' + encodeURIComponent(mensaje), '_blank');
    cerrarModalWhatsapp();
  }

  function formatearFechaDisplay(fecha) {
    if (!fecha) return '';
    var parts = String(fecha).split('T')[0].split('-');
    if (parts.length !== 3) return String(fecha);
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function escHTML(str) {
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function mostrarSkeleton(visible) {
    var sk = document.getElementById('citas-skeleton');
    if (sk) sk.style.display = visible ? 'flex' : 'none';
  }

  function limpiarLista() {
    document.getElementById('lista-citas').innerHTML  = '';
    document.getElementById('citas-meta').textContent = '';
  }

  function setControlesEnabled(enabled) {
    ['btn-refresh', 'btn-hoy', 'btn-limpiar'].forEach(function(id) {
      var btn = document.getElementById(id);
      if (btn) btn.disabled = !enabled;
    });
  }

})();
</script>
