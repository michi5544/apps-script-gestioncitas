<style>
  /* ══ Layout base ══ */
  body { padding-bottom: 110px; }

  .admin-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
  }

  .vista        { display: none; }
  .vista.activa { display: block; }

  /* ══ Barra de navegación flotante ══ */
  .bottom-nav {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 560px;
    margin: 0 auto;
    z-index: 100;
    pointer-events: none;           /* solo los hijos reciben clics */
  }
  .bottom-nav > * { pointer-events: auto; }

  /* — Pastilla principal — */
  .nav-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    padding: 8px;
    background: rgba(255,255,255,.96);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--borde);
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(16,24,40,.16), 0 2px 6px rgba(16,24,40,.06);
  }

  .nav-btn {
    flex: 1;
    min-width: 0;
    width: auto;
    margin-top: 0;
    padding: 9px 4px 8px;
    background: none;
    border: none;
    border-radius: 20px;
    color: var(--texto-tenue);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    cursor: pointer;
    transition: background .18s, color .18s;
  }
  .nav-btn span   { display: block; }
  .nav-btn:hover  { background: #f3f5f9; }
  .nav-btn.activo { color: var(--azul-osc); background: var(--azul-claro); }

  .nav-icono {
    font-size: 21px;
    line-height: 1;
    display: block;
    margin-bottom: 3px;
    filter: grayscale(1) opacity(.7);
    transition: filter .18s, transform .18s;
  }
  .nav-btn.activo .nav-icono { filter: none; transform: translateY(-1px) scale(1.08); }

  /* — Botón central elevado (Módulos) — */
  .nav-center {
    flex: 0 0 auto;
    width: 60px;
    height: 60px;
    margin: -30px 6px 0;
    padding: 0;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(145deg, #5aa0e6, #3a78b5);
    color: #fff;
    font-size: 30px;
    font-weight: 400;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(58,120,181,.5);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .nav-center:hover  { background: linear-gradient(145deg, #4f96dd, #316aa3); }
  .nav-center:active { transform: scale(.94); }
  .nav-center-icono  { display: block; transition: transform .25s ease; }
  .nav-center[aria-expanded="true"] .nav-center-icono { transform: rotate(45deg); }
  .nav-center.modulo-activo { box-shadow: 0 0 0 4px rgba(74,144,217,.28), 0 8px 20px rgba(58,120,181,.5); }

  /* — Panel flotante de módulos — */
  .nav-modules {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 18px);
    padding: 14px;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 22px;
    box-shadow: 0 12px 34px rgba(16,24,40,.18);
    transition: opacity .2s ease, transform .2s ease, visibility .2s;
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
  }
  .nav-modules.oculto {
    opacity: 0;
    transform: translateY(10px);
    visibility: hidden;
    pointer-events: none;
  }

  .nav-modules-label {
    display: block;
    margin-bottom: 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--texto-tenue);
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .modules-scroll {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
  }

  .mod-chip {
    width: auto;
    margin-top: 0;
    padding: 12px 10px;
    border-radius: 14px;
    border: 1.5px solid var(--borde);
    background: var(--campo);
    color: var(--texto);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .mod-chip:hover  { border-color: var(--azul); color: var(--azul); background: #fff; }
  .mod-chip.activo { background: var(--azul-claro); border-color: var(--azul); color: var(--azul-osc); }

  /* ══ Tarjetas genéricas ══ */
  .card {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-info             { flex: 1; }
  .card-info strong      { display: block; font-size: 15px; }
  .card-info span        { font-size: 13px; color: #777; }
  .card-actions button   { width: auto; padding: 6px 10px; margin-left: 4px; font-size: 13px; }

  .btn-editar   { background: #f0ad4e; color: white; }
  .btn-eliminar { background: #d9534f; color: white; }

  .form-card {
    background: white;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #eee;
  }

  .titulo-vista { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #222; }

  /* ══ Tarjetas de cita ══ */
  .card-cita {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .cita-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f0f0f0;
  }

  .cita-cliente { font-size: 16px; font-weight: 600; color: #222; }

  .cita-estado {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .estado-pendiente  { background: #fff3cd; color: #856404; }
  .estado-confirmada { background: #d1ecf1; color: #0c5460; }
  .estado-completada { background: #d4edda; color: #155724; }
  .estado-cancelada  { background: #f8d7da; color: #721c24; }

  .cita-detalle {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
    color: #555;
  }
  .cita-detalle .etiqueta { font-weight: 600; color: #bbb; }
  .cita-total             { font-weight: 700; color: #222; font-size: 15px; }

  .cita-acciones {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0f0f0;
  }
  .cita-acciones button {
    flex: 1;
    width: auto;
    padding: 8px;
    font-size: 13px;
    border-radius: 8px;
    margin-top: 0;
  }

  /* ══ Chips de filtro de citas ══ */
  .filtro-citas {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filtro-citas::-webkit-scrollbar { display: none; }

  .filtro-chip {
    flex-shrink: 0;
    width: auto;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: white;
    color: #666;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    margin-top: 0;
  }
  .filtro-chip:hover  { border-color: #4a90d9; }
  .filtro-chip.activo { background: #4a90d9; border-color: #4a90d9; color: white; }

  /* ══ Skeleton loader ══ */
  .skeleton-wrapper { display: flex; flex-direction: column; gap: 12px; }
  .skeleton-card {
    height: 140px;
    border-radius: 12px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ══ Toolbar de citas ══ */
  .citas-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }

  .btn-refresh {
    background: transparent;
    border: 1px solid #ccc;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
    margin-top: 0;
  }
  .btn-refresh:hover    { background: #f5f5f5; }
  .btn-refresh:disabled { opacity: .5; cursor: not-allowed; }

  .citas-meta {
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
    min-height: 18px;
  }

  /* ══════════════════════════════════════════════════════════
     REDISEÑO — formularios y tarjetas (prefijo .admin-container
     para imponerse a los <style> propios de cada vista)
     ══════════════════════════════════════════════════════════ */
  .admin-container .titulo-vista {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 4px 0 14px;
  }

  /* — Formularios — */
  .admin-container .form-card {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--sombra);
  }

  .admin-container .form-card-header {
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 1px solid #f1f2f6;
  }
  .admin-container .form-card-header span { font-size: 16px; font-weight: 700; color: var(--texto); }

  .admin-container .btn-form-cancelar {
    background: #fff;
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    padding: 5px 12px;
  }
  .admin-container .btn-form-cancelar:hover { background: #fff5f5; border-color: var(--rojo); color: var(--rojo); }

  .admin-container .form-grid { gap: 14px 12px; margin-bottom: 14px; }
  .admin-container .form-field { gap: 6px; }

  .admin-container .field-label,
  .admin-container .agenda-field .field-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .admin-container .form-card .form-field input,
  .admin-container .form-card .form-field textarea,
  .admin-container .form-card .form-field select,
  .admin-container .agenda-field select,
  .admin-container .agenda-field input,
  .admin-container .fecha-campo input {
    min-height: 44px;
    padding: 10px 12px;
    border: 1.5px solid var(--borde);
    border-radius: var(--radio-campo);
    background: var(--campo);
    color: var(--texto);
    font-size: 15px;
  }
  .admin-container .form-card .form-field textarea { min-height: 76px; }

  .admin-container .form-card .form-field input:hover,
  .admin-container .form-card .form-field textarea:hover,
  .admin-container .form-card .form-field select:hover,
  .admin-container .agenda-field select:hover,
  .admin-container .agenda-field input:hover { border-color: #cfd6e4; }

  .admin-container .form-card .form-field input:focus,
  .admin-container .form-card .form-field textarea:focus,
  .admin-container .form-card .form-field select:focus,
  .admin-container .agenda-field select:focus,
  .admin-container .agenda-field input:focus,
  .admin-container .fecha-campo input:focus {
    outline: none;
    border-color: var(--azul);
    background: #fff;
    box-shadow: var(--anillo);
  }

  .admin-container .btn-guardar,
  .admin-container .btn-generar {
    min-height: 46px;
    padding: 12px;
    border-radius: var(--radio-campo);
    font-size: 15px;
    font-weight: 700;
    background: var(--azul);
    box-shadow: 0 2px 6px rgba(74,144,217,.35);
  }
  .admin-container .btn-guardar:hover,
  .admin-container .btn-generar:hover { background: var(--azul-osc); }
  .admin-container .btn-guardar:disabled,
  .admin-container .btn-generar:disabled { background: #9dbfe8; box-shadow: none; }

  .admin-container .form-feedback,
  .admin-container .generar-feedback {
    border-radius: var(--radio-campo);
    font-weight: 600;
    text-align: left;
    padding: 10px 14px;
  }

  /* — Tarjetas de lista (servicios, productos, clientes, horarios, genéricas) — */
  .admin-container .servicio-card,
  .admin-container .cliente-card,
  .admin-container .horario-card,
  .admin-container .card,
  .admin-container .card-cita {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    transition: box-shadow .15s, transform .15s;
  }
  .admin-container .servicio-card,
  .admin-container .cliente-card { padding: 16px; margin-bottom: 12px; }
  .admin-container .horario-card { padding: 12px 16px; margin-bottom: 10px; }
  .admin-container .card { padding: 14px 16px; margin-bottom: 12px; }

  .admin-container .servicio-card:hover,
  .admin-container .cliente-card:hover,
  .admin-container .card:hover {
    box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 8px 22px rgba(16,24,40,.09);
  }

  .admin-container .servicio-nombre { font-size: 16px; font-weight: 700; color: var(--texto); }
  .admin-container .servicio-desc   { font-size: 13px; color: var(--texto-suave); line-height: 1.4; }
  .admin-container .servicio-top    { margin-bottom: 10px; }
  .admin-container .servicio-chips  { gap: 8px; margin-top: 8px; }

  .admin-container .servicio-acciones button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }

  .admin-container .chip-dato {
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 700;
  }

  .admin-container .horario-hora { font-size: 16px; font-weight: 700; }

  .admin-container .empleado-avatar,
  .admin-container .cliente-avatar {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #eaf2fb, #d6e6f8);
    color: #1a5fa8;
    font-size: 14px;
  }

  /* — Buscador y filtros — */
  .admin-container .buscador-wrap input { padding-left: 38px !important; }
  .admin-container .filtro-chip,
  .admin-container .btn-mini { min-height: 38px; }
  .admin-container .filtro-chip { padding: 8px 18px; }
  .admin-container .filtro-chip.activo { box-shadow: 0 2px 6px rgba(74,144,217,.35); }

  /* — Reportes — */
  .admin-container .reporte-metrica {
    border-radius: var(--radio);
    padding: 14px 16px;
    box-shadow: var(--sombra);
    background: var(--superficie);
  }
  .admin-container .reporte-metrica.destacado { background: var(--azul-claro); }
  .admin-container .reporte-metrica.ingreso   { background: #e3f4e8; }
  .admin-container .reporte-metrica-label { color: var(--texto-suave); }
  .admin-container .reporte-metrica-valor { font-size: 24px; letter-spacing: -0.01em; }

  /* — Tarjetas de cita — */
  .admin-container .card-cita { padding: 16px 16px 14px; margin-bottom: 14px; border-left-width: 4px; }
  .admin-container .cita-cliente { font-size: 17px; font-weight: 700; }
  .admin-container .cita-chip { background: var(--azul-claro); color: #1a5fa8; }
  .admin-container .cita-chip.cita-chip-vencida { background: #fff3cd; color: #856404; }

  /* — Móvil estrecho: formularios a una columna — */
  @media (max-width: 420px) {
    .admin-container { padding: 12px; }
    .admin-container .form-card { padding: 14px; }
    .admin-container .form-field { min-width: 100%; }
    .admin-container .agenda-selector-row { flex-direction: column; gap: 10px; }
    .admin-container .generar-grid .agenda-field { max-width: 100%; min-width: 100%; }
    .admin-container .cita-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
